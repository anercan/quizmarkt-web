  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #00d4ff, #3E8E41);
            color: white;
            padding: 20px 10px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
        }

        header p {
            margin: 10px 0;
            font-size: 1.1rem;
        }

        section {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
        }

        .feature {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            flex: 1;
            min-width: 280px;
            text-align: center;
        }

        .feature img {
            width: 80px;
            margin-bottom: 15px;
        }

        .cta {
            text-align: center;
            margin: 40px 0;
        }

        .cta button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .cta button:hover {
            background: #3E8E41;
        }

        footer {
            background: #f1f1f1;
            color: #555;
            text-align: center;
            padding: 15px 0;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }

            .features {
                flex-direction: column;
            }
        }
    </style>
	
  </head>

                 </a>
                </section>
            </div>
        </div>
